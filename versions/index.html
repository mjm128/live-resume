<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Versions</title>
    <style>
      :root {
        --bg-color: #121212; --primary-text-color: #e0e0e0; --secondary-text-color: #b3b3b3;
        --card-bg-color: #1e1e1e; --border-color: #333; --accent-color: #bb86fc;
        --accent-hover-color: #3700b3;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        margin: 0; padding: 2rem; background-color: var(--bg-color); color: var(--primary-text-color);
        line-height: 1.6;
      }
      .container { max-width: 800px; margin: auto; }
      h1 { border-bottom: 1px solid var(--border-color); padding-bottom: 0.5em; font-weight: 600; }
      ul { list-style: none; padding: 0; }
      li {
        background-color: var(--card-bg-color); border: 1px solid var(--border-color); border-radius: 8px;
        margin-bottom: 1rem; padding: 1.5rem; display: flex; justify-content: space-between;
        align-items: center; transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      }
      li:hover { transform: translateY(-3px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); }
      .theme-name { font-size: 1.2rem; font-weight: 500; color: var(--primary-text-color); }
      .links a {
        text-decoration: none; color: var(--accent-color); font-weight: 600; margin-left: 1rem;
        padding: 0.5em 1em; border: 1px solid var(--accent-color); border-radius: 6px;
        transition: background-color 0.2s, color 0.2s;
      }
      .links a:hover { background-color: var(--accent-color); color: var(--bg-color); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resume Versions</h1>
        <ul>
            <li>
                <span class="theme-name">Latest Version</span>
                <div class="links">
                    <a href="/">Go to Live Page</a>
                </div>
            </li>
            <li>
                <span class="theme-name">2025-09-16</span>
                <div class="links">
                    <a href="./2025-09-16/">Go to Version</a>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
